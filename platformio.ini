; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
; Only compile dependencies compatible with the ESP32 platform.
lib_compat_mode = strict
lib_deps = 
	esp32async/AsyncTCP@^3.5.0
	adafruit/Adafruit SSD1306@^2.5.17
	esp32async/ESPAsyncWebServer@^3.12.1
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	; Registry 1.0.0 lacks the FM3 constructor and public APIs used by this project.
	; GitHub release v1.4, pinned to its commit (upstream metadata still says 1.0.0).
	https://github.com/tysonlt/AxeFxControl/archive/2e51d11d4fc6cadd08dd0e437d905f0bad1947f7.zip
